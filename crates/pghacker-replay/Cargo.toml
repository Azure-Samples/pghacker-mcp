[package]
name = "pghacker-replay"
description = "Replays recorded agent searches through code search and compares them with ripgrep and GNU grep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
futures-util.workspace = true
pghacker-code.workspace = true
pghacker-codesearch.workspace = true
pghacker-core.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# A performance-tuning program, not an API example: it compares wide searches
# and pipeline counts on the full PG19 tree with GNU grep. Cargo builds it as an
# example.
[[example]]
name = "profile_full"
path = "perf_tuning/profile_full.rs"
doc-scrape-examples = false

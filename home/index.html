<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="pghacker-mcp" />
    <!-- The repository the top bar links to. scripts/home.mjs adds its stars, as data-stars, once GitHub shows them. -->
    <meta name="github-repo" content="Azure-Samples/pghacker-mcp" />
    <!-- A deployment's privacy statement and copyright link, which the footer shows, aren't here: scripts/home.mjs adds them, as privacy-url and copyright-link meta tags, when the deployment sets PGHACKER_PRIVACY_URL, and PGHACKER_COPYRIGHT_URL with PGHACKER_COPYRIGHT_TEXT. -->
    <meta
      name="description"
      content="pghacker-mcp is a public MCP server that gives AI agents cited answers about PostgreSQL's design history and code, from the pgsql-hackers mailing list and PostgreSQL's source and commit history."
    />
    <title>pghacker-mcp · Cited answers about PostgreSQL's design history and code</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="noscript">
        <h1>pghacker-mcp</h1>
        <p>
          A public MCP server that gives AI agents cited answers about PostgreSQL's design history and code, from the
          pgsql-hackers mailing list and PostgreSQL's source with its full commit history.
        </p>
        <p>
          Its endpoint is <code>/mcp</code> on this site. Add it to your agent as a remote MCP server (Streamable
          HTTP); it needs no sign-in.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# pghacker-indexer, as pgh_indexer: its tools for the agents (3101), and its
# job workers, which retrieve the mail archive and sync PostgreSQL's history
# through the firewall. Only the indexer that holds the session advisory lock
# runs jobs, so a rolling update overlaps the old and the new safely
# (deploy/README.md, "Updates"). Its cache and git clone are on an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: pghacker-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: pghacker-mcp
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      nodeSelector:
        pghacker.io/pool: services
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: indexer
          image: ${IMAGE}
          args: [/usr/local/bin/pghacker-indexer, serve]
          env: ${ENV_INDEXER}
          ports:
            - { name: http, containerPort: 3101 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: data, mountPath: /var/lib/pghacker }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: indexer }
        - name: data
          emptyDir: { sizeLimit: 16Gi }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: pghacker-mcp
spec:
  selector:
    app.kubernetes.io/name: indexer
  ports:
    - { name: http, port: 3101, targetPort: http, protocol: TCP }

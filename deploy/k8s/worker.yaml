# The PilotSwarm worker (scripts/worker.mjs), on the PilotSwarm pool, which is
# tainted for it and the portal: every agent session runs here, the crawl's
# and the portal's, with the agents' shell, and the crawl scheduler with them
# (${WORKER_ARGS} carries --crawl unless PGHACKER_CRAWL is off). It's an agent
# (pghacker.io/role: agent): its NetworkPolicy lets it reach only the indexer,
# pghacker-mcp's internal listener, the token proxy and its database, and the
# firewall gives its nodes no internet. It has no Azure identity and no
# Kubernetes API token, and reads only pgh_swarm's password. Its sidecar has
# an audience-bound mesh identity token. One replica, replaced
# rather than overlapped: two crawl schedulers would race over the sessions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: pghacker-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: pghacker-mcp
        pghacker.io/role: agent
    spec:
      serviceAccountName: swarm
      automountServiceAccountToken: false
      nodeSelector:
        pghacker.io/pool: swarm
      tolerations:
        - { key: pghacker.io/pool, operator: Equal, value: swarm, effect: NoSchedule }
      # The scheduler's stop (up to 20 s) and the worker's drain
      # (PILOTSWARM_WORKER_SHUTDOWN_TIMEOUT_MS, 30 s), with a margin.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ${IMAGE}
          args: ${WORKER_ARGS}
          env: ${ENV_WORKER}
          # The crawl scheduler holds back above 85% of this limit, and sheds
          # sessions above 92% (scripts/lib/crawl.mjs): it must fit the node
          # with the portal's pods. For more sessions, give swarm_pool a
          # larger vm_size and raise it.
          resources:
            requests: { cpu: "2", memory: 6Gi }
            limits: { memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: catalog, mountPath: /etc/pghacker, readOnly: true }
            - { name: data, mountPath: /var/lib/pghacker }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: swarm }
        - name: catalog
          configMap: { name: model-catalog }
        # Sessions' state and the agents' home; the Copilot CLI's tool
        # output, which the agents' shell parses, goes to /tmp.
        - name: data
          emptyDir: { sizeLimit: 16Gi }
        - name: tmp
          emptyDir: { sizeLimit: 8Gi }
